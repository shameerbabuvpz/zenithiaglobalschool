<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Cinzel = engraved classical caps (international award look). Archivo + Inter for support. -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  @page { size: A4 portrait; margin: 0; }
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --maroon:#7A1F35; --maroon-deep:#3f0f1d; --maroon-glow:#9c3550;
    --gold:#E7CFA1; --gold-deep:#B9924E; --gold-lite:#FBEFD2;
    --ink:#181819; --white:#F7F5F2;
  }
  html,body{ width:210mm; height:297mm; }
  body{ font-family:'Inter','Helvetica Neue',Arial,sans-serif; color:var(--white);
        position:relative; overflow:hidden; background:#2c0c17; }

  /* ---------- layered, textured stage ---------- */
  .bg-base{ position:absolute; inset:0;
    background:
      radial-gradient(120% 80% at 50% 22%, var(--maroon-glow) 0%, var(--maroon) 36%, var(--maroon-deep) 100%); }
  /* damask / guilloché pattern, very subtle gold lines */
  .bg-pattern{ position:absolute; inset:0; opacity:.10; mix-blend-mode:screen;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120' viewBox='0 0 120 120'><g fill='none' stroke='%23E7CFA1' stroke-width='1'><circle cx='60' cy='60' r='34'/><circle cx='60' cy='60' r='20'/><path d='M60 8 C40 30 40 90 60 112 C80 90 80 30 60 8 Z'/><path d='M8 60 C30 40 90 40 112 60 C90 80 30 80 8 60 Z'/><circle cx='0' cy='0' r='10'/><circle cx='120' cy='0' r='10'/><circle cx='0' cy='120' r='10'/><circle cx='120' cy='120' r='10'/></g></svg>");
    background-size:46mm 46mm; }
  /* radial spotlight behind the medallion */
  .bg-spot{ position:absolute; left:50%; top:46%; transform:translate(-50%,-50%);
    width:150mm; height:150mm; border-radius:50%;
    background:radial-gradient(circle, rgba(251,239,210,.16) 0%, rgba(251,239,210,0) 62%); }
  /* fine film-grain noise */
  .bg-noise{ position:absolute; inset:0; opacity:.05; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }
  .vignette{ position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(125% 85% at 50% 40%, rgba(24,8,14,0) 48%, rgba(24,8,14,.7) 100%); }

  /* ---------- ornate gold frame ---------- */
  .frame-outer{ position:absolute; inset:7mm; border:2.6pt solid var(--gold-deep); border-radius:2mm;
    box-shadow:0 0 0 0.6pt rgba(231,207,161,.35), inset 0 0 26mm rgba(24,8,14,.45); }
  .frame-inner{ position:absolute; inset:10mm;
    border:1pt solid rgba(231,207,161,.55); border-radius:1.5mm; }
  .frame-hair{ position:absolute; inset:11.4mm; border:0.5pt solid rgba(231,207,161,.3); border-radius:1mm; }

  /* deco corner ornaments */
  .deco{ position:absolute; width:40mm; height:40mm; }
  .deco svg{ width:100%; height:100%; }
  .deco.tl{ top:9mm; left:9mm; } .deco.tr{ top:9mm; right:9mm; transform:scaleX(-1); }
  .deco.bl{ bottom:9mm; left:9mm; transform:scaleY(-1); } .deco.br{ bottom:9mm; right:9mm; transform:scale(-1,-1); }

  /* gold-foil text helper */
  .foil{ background:linear-gradient(180deg, var(--gold-lite) 0%, var(--gold) 36%, var(--gold-deep) 70%, var(--gold-lite) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    -webkit-text-fill-color:transparent; }

  .page{ position:absolute; inset:7mm; padding:13mm 18mm 11mm; display:flex; flex-direction:column;
    align-items:center; text-align:center; z-index:3; }

  .head img{ height:23mm; filter:drop-shadow(0 2mm 4mm rgba(24,8,14,.5)); }

  .rosette{ margin-top:4mm; width:21mm; height:21mm; }

  .eyebrow{ margin-top:3mm; font-family:'Cinzel',serif; font-size:10.5pt; letter-spacing:.42em; font-weight:600;
    color:var(--gold-lite); text-transform:uppercase; }

  .month{ margin-top:4mm; font-family:'Cinzel',serif; font-weight:800; font-size:40pt; line-height:1;
    letter-spacing:.03em; text-transform:uppercase;
    display:flex; align-items:center; gap:9mm; justify-content:center; }
  .month .orn{ width:14mm; height:1.6pt; background:linear-gradient(90deg,transparent,var(--gold)); }
  .month .orn.r{ background:linear-gradient(90deg,var(--gold),transparent); }

  .title{ margin-top:5mm; font-family:'Cinzel',serif; font-weight:600; font-size:16pt; letter-spacing:.42em;
    color:var(--gold-lite); text-transform:uppercase; }
  .title-rule{ margin:5mm auto 0; display:flex; align-items:center; justify-content:center; gap:4mm; color:var(--gold); font-size:11pt; }
  .title-rule .seg{ width:30mm; height:1pt; background:linear-gradient(90deg,transparent,var(--gold),transparent); }

  /* photo medallion with starburst + double gold ring */
  .medal{ margin-top:7mm; position:relative; width:100mm; height:100mm; display:flex; align-items:center; justify-content:center; }
  .burst{ position:absolute; inset:0; }
  .burst svg{ width:100%; height:100%; }
  .ring{ position:relative; width:78mm; height:78mm; border-radius:50%; z-index:2;
    padding:2.4mm; background:linear-gradient(145deg, var(--gold-lite), var(--gold-deep) 60%, var(--gold-lite));
    box-shadow:0 10mm 26mm rgba(24,8,14,.55), 0 0 0 0.6mm rgba(231,207,161,.5); }
  .photo{ width:100%; height:100%; border-radius:50%; overflow:hidden; position:relative;
    background:radial-gradient(circle at 50% 38%, #6d1a2e, #470f1f);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3mm;
    border:1pt solid rgba(24,8,14,.4); }
  .photo .ph-icon{ font-size:30pt; color:rgba(231,207,161,.55); }
  .photo .ph-text{ font-size:8.5pt; letter-spacing:.34em; color:rgba(231,207,161,.65); text-transform:uppercase; }
  /* small banner ribbon at medallion base */
  .ribbon{ position:absolute; bottom:-3mm; left:50%; transform:translateX(-50%); z-index:3;
    font-family:'Cinzel',serif; font-size:9pt; letter-spacing:.3em; color:var(--maroon-deep); font-weight:700;
    background:linear-gradient(180deg,var(--gold-lite),var(--gold)); padding:2.4mm 9mm; border-radius:2mm;
    box-shadow:0 3mm 8mm rgba(24,8,14,.5); text-transform:uppercase; }

  .stars{ margin-top:11mm; font-size:13pt; letter-spacing:.45em; }
  .stars .foil{ /* gold stars */ }

  .name{ margin-top:4mm; font-family:'Cinzel',serif; font-weight:700; font-size:25pt; letter-spacing:.06em;
    color:var(--white); text-transform:uppercase; text-shadow:0 2mm 6mm rgba(24,8,14,.4); }
  .name-orn{ margin:3.5mm auto 0; display:flex; align-items:center; justify-content:center; gap:4mm; color:var(--gold); font-size:11pt; }
  .name-orn .seg{ width:24mm; height:1pt; background:linear-gradient(90deg,transparent,var(--gold),transparent); }

  .klass{ margin-top:5mm; display:inline-block; padding:3.2mm 12mm; border-radius:30mm;
    border:1pt solid var(--gold-deep); background:rgba(231,207,161,.06);
    font-family:'Cinzel',serif; font-size:11.5pt; letter-spacing:.2em; font-weight:600; color:var(--gold-lite); text-transform:uppercase; }

  .foot{ margin-top:auto; padding-top:7mm; }
  .foot .line{ display:flex; align-items:center; justify-content:center; gap:4mm; color:var(--gold); font-size:9pt; margin-bottom:3.5mm; }
  .foot .line .seg{ width:22mm; height:1pt; background:linear-gradient(90deg,transparent,var(--gold),transparent); }
  .foot .url{ font-family:'Cinzel',serif; font-size:11pt; letter-spacing:.18em; font-weight:600; }
  .foot .tag{ margin-top:2.5mm; font-size:8pt; letter-spacing:.34em; color:rgba(231,207,161,.65); text-transform:uppercase; }
</style>
</head>
<body>
  <div class="bg-base"></div>
  <div class="bg-pattern"></div>
  <div class="bg-spot"></div>
  <div class="bg-noise"></div>
  <div class="vignette"></div>

  <div class="frame-outer"></div>
  <div class="frame-inner"></div>
  <div class="frame-hair"></div>

  <!-- ornate deco corners -->
  <div class="deco tl"><svg viewBox="0 0 120 120" fill="none" stroke="#E7CFA1" stroke-width="1.5" stroke-linecap="round">
    <path d="M6 54 Q6 6 54 6"/><path d="M14 60 Q14 14 60 14" opacity=".55"/>
    <path d="M6 54 q22 -2 30 -28" opacity=".8"/><path d="M54 6 q-2 22 -28 30" opacity=".8"/>
    <circle cx="6" cy="54" r="2.4" fill="#E7CFA1" stroke="none"/><circle cx="54" cy="6" r="2.4" fill="#E7CFA1" stroke="none"/>
    <path d="M30 30 l9 0 M30 30 l0 9"/><circle cx="30" cy="30" r="3" /></svg></div>
  <div class="deco tr"><svg viewBox="0 0 120 120" fill="none" stroke="#E7CFA1" stroke-width="1.5" stroke-linecap="round">
    <path d="M6 54 Q6 6 54 6"/><path d="M14 60 Q14 14 60 14" opacity=".55"/>
    <path d="M6 54 q22 -2 30 -28" opacity=".8"/><path d="M54 6 q-2 22 -28 30" opacity=".8"/>
    <circle cx="6" cy="54" r="2.4" fill="#E7CFA1" stroke="none"/><circle cx="54" cy="6" r="2.4" fill="#E7CFA1" stroke="none"/>
    <path d="M30 30 l9 0 M30 30 l0 9"/><circle cx="30" cy="30" r="3" /></svg></div>
  <div class="deco bl"><svg viewBox="0 0 120 120" fill="none" stroke="#E7CFA1" stroke-width="1.5" stroke-linecap="round">
    <path d="M6 54 Q6 6 54 6"/><path d="M14 60 Q14 14 60 14" opacity=".55"/>
    <path d="M6 54 q22 -2 30 -28" opacity=".8"/><path d="M54 6 q-2 22 -28 30" opacity=".8"/>
    <circle cx="6" cy="54" r="2.4" fill="#E7CFA1" stroke="none"/><circle cx="54" cy="6" r="2.4" fill="#E7CFA1" stroke="none"/>
    <path d="M30 30 l9 0 M30 30 l0 9"/><circle cx="30" cy="30" r="3" /></svg></div>
  <div class="deco br"><svg viewBox="0 0 120 120" fill="none" stroke="#E7CFA1" stroke-width="1.5" stroke-linecap="round">
    <path d="M6 54 Q6 6 54 6"/><path d="M14 60 Q14 14 60 14" opacity=".55"/>
    <path d="M6 54 q22 -2 30 -28" opacity=".8"/><path d="M54 6 q-2 22 -28 30" opacity=".8"/>
    <circle cx="6" cy="54" r="2.4" fill="#E7CFA1" stroke="none"/><circle cx="54" cy="6" r="2.4" fill="#E7CFA1" stroke="none"/>
    <path d="M30 30 l9 0 M30 30 l0 9"/><circle cx="30" cy="30" r="3" /></svg></div>

  <div class="page">
    <div class="head"><img src="../../public/brand/logo-full-white.png" alt="Zenithia Global School"/></div>

    <!-- award rosette -->
    <div class="rosette"><svg viewBox="0 0 100 100">
      <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#FBEFD2"/><stop offset=".6" stop-color="#E7CFA1"/><stop offset="1" stop-color="#B9924E"/></linearGradient></defs>
      <g fill="none" stroke="url(#g)" stroke-width="2.4"><circle cx="50" cy="42" r="24"/><circle cx="50" cy="42" r="18" stroke-width="1" opacity=".6"/></g>
      <path d="M50 28 l4.6 9.4 10.3 1.5 -7.5 7.3 1.8 10.3 -9.2-4.9 -9.2 4.9 1.8-10.3 -7.5-7.3 10.3-1.5z" fill="url(#g)"/>
      <path d="M38 64 l-7 24 12-6.5 8 9.5 4-22z" fill="#7A1F35" stroke="url(#g)" stroke-width="1.8"/>
      <path d="M62 64 l7 24 -12-6.5 -8 9.5 -4-22z" fill="#7A1F35" stroke="url(#g)" stroke-width="1.8"/></svg></div>

    <div class="eyebrow">Celebrating Excellence</div>

    <!-- EDIT MONTH -->
    <div class="month"><span class="orn"></span><span class="foil">Month Year</span><span class="orn r"></span></div>

    <div class="title">Student of the Month</div>
    <div class="title-rule"><span class="seg"></span><span class="foil">&#10038;</span><span class="seg"></span></div>

    <!-- photo medallion -->
    <div class="medal">
      <div class="burst"><svg viewBox="0 0 200 200">
        <g stroke="#E7CFA1" stroke-width="0.8" opacity=".5">
          <!-- radiating rays -->
          <g id="rays" fill="none"></g>
        </g>
        <g fill="#E7CFA1" opacity=".5">
          <!-- 24 ray triangles -->
          <g transform="translate(100,100)">
            <g id="ray"></g>
          </g>
        </g>
        <g fill="none" stroke="#E7CFA1" stroke-width="1" opacity=".45">
          <circle cx="100" cy="100" r="96"/>
        </g>
        <g fill="#E7CFA1" opacity=".55">
          <!-- generated rays -->
          <g transform="translate(100 100)">
            <polygon points="-3,-98 3,-98 0,-72"/>
            <polygon points="-3,-98 3,-98 0,-72" transform="rotate(15)"/>
            <polygon points="-3,-98 3,-98 0,-72" transform="rotate(30)"/>
            <polygon points="-3,-98 3,-98 0,-72" transform="rotate(45)"/>
            <polygon points="-3,-98 3,-98 0,-72" transform="rotate(60)"/>

            <polygon points="-3,-98 3,-98 0,-72" transform="rotate(90)"/>
            <polygon points="-3,-98 3,-98 0,-72" transform="rotate(105)"/>
            <polygon points="-3,-98 3,-98 0,-72" transform="rotate(120)"/>
            <polygon points="-3,-98 3,-98 0,-72" transform="rotate(135)"/>
            <polygon points="-3,-98 3,-98 0,-72" transform="rotate(150)"/>
            <polygon points="-3,-98 3,-98 0,-72" transform="rotate(165)"/>
            <polygon points="-3,-98 3,-98 0,-72" transform="rotate(180)"/>
            <polygon points="-3,-98 3,-98 0,-72" transform="rotate(195)"/>
            <polygon points="-3,-98 3,-98 0,-72" transform="rotate(210)"/>
            <polygon points="-3,-98 3,-98 0,-72" transform="rotate(225)"/>
            <polygon points="-3,-98 3,-98 0,-72" transform="rotate(240)"/>
            <polygon points="-3,-98 3,-98 0,-72" transform="rotate(255)"/>
            <polygon points="-3,-98 3,-98 0,-72" transform="rotate(270)"/>
            <polygon points="-3,-98 3,-98 0,-72" transform="rotate(285)"/>
            <polygon points="-3,-98 3,-98 0,-72" transform="rotate(300)"/>
            <polygon points="-3,-98 3,-98 0,-72" transform="rotate(315)"/>
            <polygon points="-3,-98 3,-98 0,-72" transform="rotate(330)"/>
            <polygon points="-3,-98 3,-98 0,-72" transform="rotate(345)"/>
          </g>
        </g>
      </svg></div>
      <div class="ring">
        <div class="photo">
          <div class="ph-icon">&#128247;</div>
          <div class="ph-text">Add Photo</div>
        </div>
      </div>
      <div class="ribbon">Awarded</div>
    </div>

    <div class="stars"><span class="foil">&#9733; &#9733; &#9733; &#9733; &#9733;</span></div>

    <!-- EDIT NAME -->
    <div class="name">[ Student Name ]</div>
    <div class="name-orn"><span class="seg"></span><span class="foil">&#10022;</span><span class="seg"></span></div>

    <!-- EDIT CLASS / DIVISION -->
    <div class="klass">Class / Division</div>

    <div class="foot">
      <div class="line"><span class="seg"></span><span class="foil">&#10038;</span><span class="seg"></span></div>
      <div class="url foil">zenithiaglobalschool.com</div>
      <div class="tag">Knowledge &bull; Character &bull; Excellence</div>
    </div>
  </div>
</body>
</html>
